<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>霓虹跑酷 · Neon Runner</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{
    height:100%;margin:0;overflow:hidden;background:#05030d;
    font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
    color:#e9ecff;display:grid;place-items:center;user-select:none;
  }
  #wrap{
    position:relative;
    width:min(96vw, calc(94vh * 900 / 540));
    aspect-ratio:900/540;
    border-radius:18px;overflow:hidden;
    background:#0b0620;touch-action:none;
    box-shadow:0 0 80px rgba(120,70,255,.35),0 0 0 1px rgba(160,130,255,.25),0 20px 60px rgba(0,0,0,.7);
  }
  canvas{display:block;width:100%;height:100%;}

  /* ---------- HUD ---------- */
  .hud{position:absolute;inset:0;padding:18px 22px;display:flex;justify-content:space-between;
       align-items:flex-start;pointer-events:none;font-weight:800;}
  .hud-left .label{font-size:12px;letter-spacing:3px;color:#8ea3d6;}
  .hud-left .value{font-size:38px;line-height:1;color:#dff6ff;font-variant-numeric:tabular-nums;
       text-shadow:0 0 18px rgba(34,211,238,.85);}
  .hud-right{display:flex;gap:10px;}
  .chip{background:rgba(20,14,48,.6);border:1px solid rgba(140,120,255,.35);border-radius:999px;
        padding:7px 14px;font-size:16px;display:flex;gap:6px;align-items:center;backdrop-filter:blur(6px);}
  .chip .ico{color:#ffd166;}
  .chip .ico.c{color:#22d3ee;}

  /* ---------- 覆盖层 ---------- */
  .overlay{position:absolute;inset:0;display:grid;place-items:center;z-index:10;
    background:rgba(6,3,20,.74);backdrop-filter:blur(7px);transition:opacity .25s ease;}
  .overlay.hidden{opacity:0;pointer-events:none;}
  .panel{
    width:min(88%,520px);padding:28px 32px;border-radius:22px;text-align:center;
    background:linear-gradient(160deg,rgba(38,22,80,.95),rgba(16,9,38,.96));
    border:1px solid rgba(150,120,255,.35);
    box-shadow:0 0 60px rgba(120,70,255,.35),inset 0 0 40px rgba(120,70,255,.08);
    animation:pop .3s cubic-bezier(.2,1.4,.5,1);
  }
  @keyframes pop{from{transform:scale(.9);opacity:0}to{transform:scale(1);opacity:1}}
  .panel.hidden{display:none;}

  .title{font-size:42px;margin:0 0 4px;letter-spacing:6px;
    background:linear-gradient(90deg,#22d3ee,#a78bfa,#ff4d94);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 0 18px rgba(160,120,255,.7));}
  .title.small{font-size:26px;letter-spacing:4px;}
  .sub{margin:0 0 18px;font-size:12px;letter-spacing:8px;color:#8ea3d6;}

  .keys{margin:18px 0;display:flex;flex-direction:column;gap:9px;font-size:14px;color:#b9c6f0;}
  kbd{background:rgba(120,100,220,.25);border:1px solid rgba(150,130,255,.45);border-radius:6px;
      padding:2px 8px;font-family:inherit;font-size:13px;color:#e8ecff;}

  .btn-row{display:flex;gap:12px;justify-content:center;margin-top:20px;flex-wrap:wrap;}
  .btn{font:inherit;font-weight:800;font-size:16px;letter-spacing:1px;padding:12px 26px;
    border-radius:12px;cursor:pointer;border:1px solid rgba(140,120,255,.5);
    background:rgba(50,35,100,.55);color:#dfe6ff;transition:transform .12s,box-shadow .2s,background .2s;}
  .btn:hover{transform:translateY(-2px);background:rgba(70,50,140,.7);box-shadow:0 8px 24px rgba(110,70,255,.35);}
  .btn:active{transform:translateY(0) scale(.97);}
  .btn.primary{background:linear-gradient(135deg,#22d3ee,#7c5cff 60%,#ff4d94);border:none;color:#0a0620;
    box-shadow:0 6px 26px rgba(120,90,255,.5);}
  .btn.small{padding:9px 18px;font-size:14px;}
  .btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none;}

  .hint{margin-top:14px;font-size:13px;color:#8ea3d6;letter-spacing:1px;}
  .hint span{color:#ffd166;font-weight:900;}

  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0 4px;}
  .stat{background:rgba(30,20,70,.6);border:1px solid rgba(130,110,255,.22);border-radius:14px;padding:14px 6px;}
  .stat .k{font-size:12px;color:#8ea3d6;letter-spacing:2px;}
  .stat .v{font-size:25px;font-weight:900;color:#dff6ff;font-variant-numeric:tabular-nums;
           text-shadow:0 0 16px rgba(34,211,238,.6);}

  .save-row{display:flex;gap:10px;justify-content:center;margin-top:16px;}
  #name-input{font:inherit;font-size:15px;padding:10px 14px;border-radius:11px;width:170px;
    border:1px solid rgba(140,120,255,.4);background:rgba(12,7,30,.8);color:#e9ecff;
    outline:none;text-align:center;letter-spacing:1px;}
  #name-input:focus{border-color:#22d3ee;box-shadow:0 0 0 3px rgba(34,211,238,.15);}

  .board{max-height:290px;overflow-y:auto;margin:16px 0 0;display:flex;flex-direction:column;
         gap:8px;text-align:left;padding-right:4px;}
  .board::-webkit-scrollbar{width:6px;}
  .board::-webkit-scrollbar-thumb{background:rgba(140,120,255,.4);border-radius:3px;}
  .row{display:grid;grid-template-columns:36px 1fr auto auto;gap:10px;align-items:center;
    background:rgba(30,20,70,.5);border:1px solid rgba(130,110,255,.16);
    border-radius:11px;padding:10px 14px;font-size:15px;}
  .row.top{background:linear-gradient(90deg,rgba(255,196,0,.16),rgba(255,80,160,.12));
           border-color:rgba(255,196,0,.45);}
  .rank{font-weight:900;color:#8ea3d6;text-align:center;}
  .row.top .rank{color:#ffd166;}
  .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .coins{color:#67e8f9;font-size:13px;white-space:nowrap;}
  .score{font-weight:900;color:#fff;font-variant-numeric:tabular-nums;}
  .empty{text-align:center;color:#7c8ab8;padding:34px 0;font-size:14px;}

  /* ---------- 触屏按钮 ---------- */
  .touch{position:absolute;right:18px;bottom:18px;display:none;gap:12px;z-index:5;}
  @media (pointer:coarse){ .touch{display:flex;} }
  .tbtn{width:76px;height:76px;border-radius:50%;font:inherit;font-size:17px;font-weight:900;
    color:#dff6ff;border:1px solid rgba(120,220,255,.5);background:rgba(20,40,80,.5);
    backdrop-filter:blur(4px);touch-action:none;cursor:pointer;}
  .tbtn:active{background:rgba(60,140,220,.75);}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>

  <div class="hud">
    <div class="hud-left">
      <div class="label">得分</div>
      <div class="value" id="hud-score">0</div>
    </div>
    <div class="hud-right">
      <div class="chip"><span class="ico c">◆</span><span id="hud-coins">0</span></div>
      <div class="chip"><span class="ico">★</span><span id="hud-best">0</span></div>
    </div>
  </div>

  <div class="touch">
    <button class="tbtn" id="tduck">蹲</button>
    <button class="tbtn" id="tjump">跳</button>
  </div>

  <div class="overlay" id="overlay">
    <!-- 主菜单 -->
    <div class="panel" id="panel-menu">
      <h1 class="title">霓虹跑酷</h1>
      <p class="sub">NEON RUNNER</p>
      <div class="keys">
        <div><kbd>空格</kbd> / <kbd>↑</kbd> / 点击屏幕 &nbsp;跳跃（空中可二段跳）</div>
        <div><kbd>↓</kbd> &nbsp;下蹲躲避激光墙</div>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btn-start">开始游戏</button>
        <button class="btn" id="btn-board">排行榜</button>
      </div>
      <div class="hint">历史最高分：<span id="menu-best">0</span></div>
    </div>

    <!-- 结算 -->
    <div class="panel hidden" id="panel-over">
      <h2 class="title small">游戏结束</h2>
      <div class="stats">
        <div class="stat"><div class="k">本次得分</div><div class="v" id="over-score">0</div></div>
        <div class="stat"><div class="k">金币</div><div class="v" id="over-coins">0</div></div>
        <div class="stat"><div class="k">最高分</div><div class="v" id="over-best">0</div></div>
      </div>
      <div class="save-row">
        <input id="name-input" maxlength="10" placeholder="输入昵称">
        <button class="btn small primary" id="btn-save">保存成绩</button>
      </div>
      <div class="btn-row">
        <button class="btn primary" id="btn-restart">再来一局</button>
        <button class="btn" id="btn-board2">排行榜</button>
      </div>
    </div>

    <!-- 排行榜 -->
    <div class="panel hidden" id="panel-board">
      <h2 class="title small">排行榜 · TOP 10</h2>
      <div class="board" id="board-list"></div>
      <div class="btn-row">
        <button class="btn" id="btn-board-back">返回</button>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
'use strict';

/* =========================================================
   基础设置
   ========================================================= */
const W = 900, H = 540;
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const dpr = Math.min(window.devicePixelRatio || 1, 2);
canvas.width  = W * dpr;
canvas.height = H * dpr;

const GY     = 430;      // 地面基准线
const GRAV   = 0.92;
const JUMP_V = -16.5;
const DJUMP_V= -14.2;

const LS_BEST  = 'neonrunner.best';
const LS_BOARD = 'neonrunner.board';
const LS_NAME  = 'neonrunner.name';

const store = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v === null ? d : v; }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }
};

/* =========================================================
   音效（WebAudio 合成，无需外部资源）
   ========================================================= */
let actx = null;
function beep(freq, dur, type, vol){
  try{
    if (!actx) actx = new (window.AudioContext || window.webkitAudioContext)();
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, actx.currentTime);
    g.gain.setValueAtTime(vol || 0.05, actx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, actx.currentTime + dur);
    o.connect(g); g.connect(actx.destination);
    o.start(); o.stop(actx.currentTime + dur);
  }catch(e){}
}

/* =========================================================
   绘图小工具
   ========================================================= */
function rr(x, y, w, h, r){
  r = Math.min(r, Math.abs(w)/2, Math.abs(h)/2);
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y,     x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x,     y + h, r);
  ctx.arcTo(x,     y + h, x,     y,     r);
  ctx.arcTo(x,     y,     x + w, y,     r);
  ctx.closePath();
}
function rectOverlap(a, b){
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function shrink(r, p){
  return { x: r.x + p, y: r.y + p, w: Math.max(1, r.w - 2*p), h: Math.max(1, r.h - 2*p) };
}
function circleRect(cx, cy, cr, r){
  const nx = Math.max(r.x, Math.min(cx, r.x + r.w));
  const ny = Math.max(r.y, Math.min(cy, r.y + r.h));
  const dx = cx - nx, dy = cy - ny;
  return dx*dx + dy*dy <= cr*cr;
}

/* =========================================================
   游戏状态
   ========================================================= */
const player = {
  x: 150, y: GY, vy: 0,
  onGround: true, jumps: 0, ducking: false, runPhase: 0
};

function playerHeight(){ return player.ducking ? 38 : 66; }
function playerWidth(){  return player.ducking ? 54 : 44; }
function playerRect(){
  const h = playerHeight(), w = playerWidth();
  return { x: player.x - w/2, y: player.y - h, w: w, h: h };
}

const G = {
  state: 'menu',           // menu | playing | over
  timer: 0,
  speed: 6,
  scroll: 0,
  distance: 0,
  coins: 0,
  score: 0,
  obstacles: [],
  gems: [],
  particles: [],
  stars: [],
  nextObstacle: 900,
  nextGem: 1600,
  shake: 0,
  flash: 0
};

let bestScore = parseInt(store.get(LS_BEST, '0'), 10) || 0;

for (let i = 0; i < 80; i++){
  G.stars.push({
    x: Math.random() * W,
    y: Math.random() * 340,
    r: Math.random() * 1.6 + 0.4,
    a: Math.random() * 0.6 + 0.3,
    sp: Math.random() * 0.6 + 0.1
  });
}

/* =========================================================
   粒子
   ========================================================= */
function burst(x, y, n, color){
  for (let i = 0; i < n; i++){
    G.particles.push({
      x: x, y: y,
      vx: (Math.random() - 0.5) * 7 - 1.5,
      vy: (Math.random() - 0.5) * 7 - 1,
      life: 1,
      decay: 0.018 + Math.random() * 0.03,
      size: 2 + Math.random() * 4,
      color: color
    });
  }
}
function updateParticles(){
  for (let i = G.particles.length - 1; i >= 0; i--){
    const p = G.particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.28; p.vx *= 0.99;
    p.life -= p.decay;
    if (p.life <= 0) G.particles.splice(i, 1);
  }
}
function drawParticles(){
  ctx.save();
  for (const p of G.particles){
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size * p.life, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

/* =========================================================
   玩家逻辑
   ========================================================= */
function jump(){
  if (G.state !== 'playing') return;
  const p = player;
  if (p.jumps >= 2) return;
  p.ducking = false;
  p.vy = (p.jumps === 0) ? JUMP_V : DJUMP_V;
  p.jumps++;
  p.onGround = false;
  burst(p.x, p.y, 7, '#67e8f9');
  beep(p.jumps === 1 ? 520 : 700, 0.09, 'square', 0.035);
}

function setDuck(v){
  if (G.state !== 'playing') return;
  player.ducking = v;
}

function updatePlayer(){
  const p = player;
  p.vy += GRAV;
  if (p.ducking && !p.onGround) p.vy += 0.85;     // 空中下蹲快速下落
  if (p.vy > 26) p.vy = 26;
  p.y += p.vy;

  if (p.y >= GY){
    p.y = GY; p.vy = 0;
    if (!p.onGround) burst(p.x, GY, 6, '#67e8f9');
    p.onGround = true;
    p.jumps = 0;
  } else {
    p.onGround = false;
  }
  p.runPhase += G.speed * 0.05;
}

/* =========================================================
   障碍 / 金币
   ========================================================= */
function obstacleRect(o){
  if (o.type === 'laser') return { x: o.x + 4, y: -200, w: o.w - 8, h: o.bottom + 200 };
  return { x: o.x, y: o.y, w: o.w, h: o.h };
}

function spawnObstacle(){
  const x = W + 100;
  const r = Math.random();

  if (r < 0.40){
    // 地面方块：跳过去
    const w = 42 + Math.random() * 30;
    const h = 46 + Math.random() * 36;
    G.obstacles.push({ type: 'box', x: x, y: GY - h, w: w, h: h });

  } else if (r < 0.72){
    // 激光墙：必须下蹲
    const gap = 48 + Math.random() * 6;
    G.obstacles.push({ type: 'laser', x: x, w: 46, bottom: GY - gap });

  } else {
    // 尖刺：跳过去
    const n = 1 + Math.floor(Math.random() * 2);
    G.obstacles.push({ type: 'spike', x: x, y: GY - 42, w: 34 * n, h: 42, n: n });
  }
}

function spawnGems(){
  const n = 3 + Math.floor(Math.random() * 4);
  const x0 = W + 140 + Math.random() * 120;
  for (let i = 0; i < n; i++){
    const t = n === 1 ? 0.5 : i / (n - 1);
    G.gems.push({
      x: x0 + i * 48,
      y: GY - (90 + Math.sin(t * Math.PI) * 60),
      r: 13,
      ph: Math.random() * 6.283
    });
  }
}

function updateObstacles(){
  const pr = shrink(playerRect(), 6);
  for (let i = G.obstacles.length - 1; i >= 0; i--){
    const o = G.obstacles[i];
    o.x -= G.speed;
    const ow = o.type === 'laser' ? o.w : o.w;
    if (o.x + ow < -120){ G.obstacles.splice(i, 1); continue; }
    if (rectOverlap(pr, shrink(obstacleRect(o), 4))){ die(); return; }
  }
}

function updateGems(){
  const pr = playerRect();
  for (let i = G.gems.length - 1; i >= 0; i--){
    const c = G.gems[i];
    c.x -= G.speed;
    c.ph += 0.16;
    if (c.x < -60){ G.gems.splice(i, 1); continue; }
    if (circleRect(c.x, c.y, c.r + 8, pr)){
      G.coins++;
      burst(c.x, c.y, 9, '#ffe066');
      beep(880, 0.07, 'triangle', 0.04);
      G.gems.splice(i, 1);
    }
  }
}

function spawnLogic(){
  G.nextObstacle -= G.speed;
  if (G.nextObstacle <= 0){
    spawnObstacle();
    const frames = Math.max(44, 76 - (G.speed - 6) * 2.6) + Math.random() * 26;
    G.nextObstacle = frames * G.speed;
  }
  G.nextGem -= G.speed;
  if (G.nextGem <= 0){
    spawnGems();
    G.nextGem = 800 + Math.random() * 1200;
  }
}

/* =========================================================
   游戏流程
   ========================================================= */
let pendingResult = null;
let resultSaved = false;
let overToken = 0;

function startGame(){
  overToken++;
  G.state = 'playing';
  G.speed = 6;
  G.scroll = 0;
  G.distance = 0;
  G.coins = 0;
  G.score = 0;
  G.obstacles = [];
  G.gems = [];
  G.particles = [];
  G.nextObstacle = 900;
  G.nextGem = 1600;
  G.shake = 0;
  G.flash = 0;

  player.x = 150;
  player.y = GY;
  player.vy = 0;
  player.jumps = 0;
  player.ducking = false;
  player.onGround = true;
  player.runPhase = 0;

  pendingResult = null;
  resultSaved = false;

  showPanel(null);
  updateHUD(true);
  try{ if (actx && actx.state === 'suspended') actx.resume(); }catch(e){}
}

function die(){
  if (G.state !== 'playing') return;
  G.state = 'over';
  G.flash = 0.85;
  G.shake = 26;
  burst(player.x, player.y - 30, 44, '#ff4d94');
  burst(player.x, player.y - 30, 18, '#ffe066');
  beep(140, 0.35, 'sawtooth', 0.07);
  setTimeout(function(){ beep(80, 0.5, 'sawtooth', 0.05); }, 100);

  const score = G.score;
  if (score > bestScore){
    bestScore = score;
    store.set(LS_BEST, String(bestScore));
  }
  pendingResult = { score: score, coins: G.coins };
  resultSaved = false;

  const token = ++overToken;
  setTimeout(function(){
    if (token !== overToken || G.state !== 'over') return;

    document.getElementById('over-score').textContent = score;
    document.getElementById('over-coins').textContent = G.coins;
    document.getElementById('over-best').textContent  = bestScore;
    document.getElementById('name-input').value = store.get(LS_NAME, '');
    const sb = document.getElementById('btn-save');
    sb.disabled = false;
    sb.textContent = '保存成绩';

    showPanel('panel-over');
    updateHUD(true);
  }, 720);
}

/* =========================================================
   主循环
   ========================================================= */
function update(){
  G.timer++;

  if (G.state === 'menu'){
    G.scroll += 1.3;
    player.runPhase += 0.16;
  } else if (G.state === 'playing'){
    G.speed = 6 + Math.min(10, G.distance / 1500);
    G.distance += G.speed;
    G.scroll += G.speed;
    G.score = Math.floor(G.distance / 10) + G.coins * 25;

    updatePlayer();
    updateObstacles();
    if (G.state !== 'playing'){ updateParticles(); return; }
    updateGems();
    spawnLogic();

    if (player.onGround && G.timer % 6 === 0){
      G.particles.push({
        x: player.x - 14, y: GY - 2,
        vx: -2 - Math.random() * 2.5,
        vy: -Math.random() * 1.6,
        life: 1, decay: 0.05,
        size: 2 + Math.random() * 3,
        color: '#67e8f9'
      });
    }
  }

  updateParticles();

  if (G.shake > 0.4) G.shake *= 0.9; else G.shake = 0;
  if (G.flash > 0.01) G.flash *= 0.9; else G.flash = 0;
}

/* =========================================================
   渲染
   ========================================================= */
function drawSky(){
  const g = ctx.createLinearGradient(0, 0, 0, H);
  g.addColorStop(0,    '#08041a');
  g.addColorStop(0.32, '#221046');
  g.addColorStop(0.62, '#571a5c');
  g.addColorStop(0.82, '#a02a63');
  g.addColorStop(1,    '#3a1030');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, W, H);
}

function drawStars(){
  ctx.save();
  for (const s of G.stars){
    const x = ((s.x - G.scroll * s.sp * 0.12) % W + W) % W;
    const a = s.a * (0.65 + 0.35 * Math.sin(G.timer * 0.05 + s.x));
    ctx.globalAlpha = a;
    ctx.fillStyle = '#cfe8ff';
    ctx.beginPath();
    ctx.arc(x, s.y, s.r, 0, 6.2832);
    ctx.fill();
  }
  ctx.restore();
}

function drawSun(){
  const cx = W * 0.72, cy = GY - 120, r = 120;

  const glow = ctx.createRadialGradient(cx, cy, 8, cx, cy, r * 1.9);
  glow.addColorStop(0,   'rgba(255,205,130,0.55)');
  glow.addColorStop(0.35,'rgba(255,120,170,0.28)');
  glow.addColorStop(1,   'rgba(255,80,160,0)');
  ctx.fillStyle = glow;
  ctx.beginPath(); ctx.arc(cx, cy, r * 1.9, 0, 6.2832); ctx.fill();

  ctx.save();
  ctx.beginPath(); ctx.arc(cx, cy, r * 0.78, 0, 6.2832); ctx.clip();
  const sg = ctx.createLinearGradient(0, cy - r, 0, cy + r);
  sg.addColorStop(0,   '#fff0b8');
  sg.addColorStop(0.45,'#ff93b8');
  sg.addColorStop(1,   '#ff4d94');
  ctx.fillStyle = sg;
  ctx.fillRect(cx - r, cy - r, r * 2, r * 2);

  ctx.fillStyle = 'rgba(10,4,28,0.62)';
  for (let i = 0; i < 8; i++){
    const yy = cy + 8 + i * 12;
    ctx.fillRect(cx - r, yy, r * 2, 2.5 + i * 1.1);
  }
  ctx.restore();
}

function drawMountains(){
  const layers = [
    { off: G.scroll * 0.08, base: GY - 6,  amp: 78, period: 230, color: '#2a1550', edge: 'rgba(160,110,255,.35)' },
    { off: G.scroll * 0.18, base: GY + 6,  amp: 54, period: 148, color: '#180d36', edge: 'rgba(120,80,220,.25)' }
  ];

  for (const L of layers){
    ctx.beginPath();
    ctx.moveTo(-20, H);
    for (let x = -20; x <= W + 20; x += 8){
      const k = x + L.off;
      const y = L.base - (Math.sin(k / L.period) * 0.62 + Math.sin(k / (L.period * 0.41)) * 0.38) * L.amp;
      ctx.lineTo(x, y);
    }
    ctx.lineTo(W + 20, H);
    ctx.closePath();
    ctx.fillStyle = L.color;
    ctx.fill();
    ctx.strokeStyle = L.edge;
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
}

function drawGround(){
  const g = ctx.createLinearGradient(0, GY, 0, H);
  g.addColorStop(0, '#1b0f38');
  g.addColorStop(1, '#070310');
  ctx.fillStyle = g;
  ctx.fillRect(0, GY, W, H - GY);

  // 网格
  ctx.save();
  ctx.strokeStyle = 'rgba(110,190,255,.16)';
  ctx.lineWidth = 1;
  const sp = 96;
  const off = G.scroll % sp;
  for (let i = -1; i < W / sp + 2; i++){
    const x = i * sp - off;
    ctx.beginPath();
    ctx.moveTo(x, GY);
    ctx.lineTo(x + (x - W / 2) * 0.75, H);
    ctx.stroke();
  }
  for (let i = 1; i <= 4; i++){
    const y = GY + Math.pow(i / 4, 2) * (H - GY);
    ctx.globalAlpha = 0.35 + i * 0.12;
    ctx.beginPath();
    ctx.moveTo(0, y); ctx.lineTo(W, y);
    ctx.stroke();
  }
  ctx.restore();

  // 地平线霓虹
  ctx.save();
  ctx.shadowColor = '#22d3ee';
  ctx.shadowBlur = 20;
  ctx.strokeStyle = '#5eeaff';
  ctx.lineWidth = 3;
  ctx.beginPath();
  ctx.moveTo(0, GY); ctx.lineTo(W, GY);
  ctx.stroke();
  ctx.restore();
}

function drawBox(o){
  const g = ctx.createLinearGradient(o.x, o.y, o.x, o.y + o.h);
  g.addColorStop(0, '#ff69a8');
  g.addColorStop(1, '#8b1e4b');

  ctx.save();
  ctx.shadowColor = '#ff2d7e';
  ctx.shadowBlur = 22;
  ctx.fillStyle = g;
  rr(o.x, o.y, o.w, o.h, 8);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,205,235,.85)';
  ctx.lineWidth = 2;
  rr(o.x, o.y, o.w, o.h, 8);
  ctx.stroke();

  ctx.fillStyle = 'rgba(255,255,255,.20)';
  rr(o.x + 6, o.y + 6, o.w - 12, 8, 4);
  ctx.fill();
}

function drawSpike(o){
  const n = o.n || 1;
  const w = o.w / n;

  ctx.save();
  ctx.shadowColor = '#ffcc00';
  ctx.shadowBlur = 20;
  ctx.fillStyle = '#ffd166';
  ctx.beginPath();
  for (let i = 0; i < n; i++){
    const x0 = o.x + i * w;
    ctx.moveTo(x0, o.y + o.h);
    ctx.lineTo(x0 + w / 2, o.y);
    ctx.lineTo(x0 + w, o.y + o.h);
    ctx.closePath();
  }
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(255,245,190,.95)';
  ctx.lineWidth = 1.6;
  ctx.stroke();
}

function drawLaser(o){
  const yBot = o.bottom;
  const w = o.w;

  const lg = ctx.createLinearGradient(o.x - 14, 0, o.x + w + 14, 0);
  lg.addColorStop(0,   'rgba(34,211,238,0)');
  lg.addColorStop(0.5, 'rgba(34,211,238,0.85)');
  lg.addColorStop(1,   'rgba(34,211,238,0)');
  ctx.fillStyle = lg;
  ctx.fillRect(o.x - 14, -10, w + 28, yBot + 10);

  ctx.fillStyle = 'rgba(235,255,255,0.95)';
  ctx.fillRect(o.x + w / 2 - 2.5, -10, 5, yBot + 10);

  ctx.save();
  ctx.shadowColor = '#22d3ee';
  ctx.shadowBlur = 18;
  ctx.fillStyle = '#0ea5b7';
  rr(o.x - 8, yBot - 14, w + 16, 18, 7);
  ctx.fill();
  ctx.restore();

  ctx.fillStyle = 'rgba(200,255,255,.9)';
  rr(o.x - 2, yBot - 9, w + 4, 5, 2.5);
  ctx.fill();
}

function drawObstacles(){
  for (const o of G.obstacles){
    if (o.type === 'box')        drawBox(o);
    else if (o.type === 'spike') drawSpike(o);
    else if (o.type === 'laser') drawLaser(o);
  }
}

function drawGems(){
  for (const c of G.gems){
    const s = 1 + Math.sin(c.ph) * 0.12;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(s, s);
    ctx.shadowColor = '#ffd166';
    ctx.shadowBlur = 20;
    ctx.fillStyle = '#ffe066';
    ctx.beginPath();
    ctx.moveTo(0, -c.r);
    ctx.lineTo(c.r * 0.75, 0);
    ctx.lineTo(0, c.r);
    ctx.lineTo(-c.r * 0.75, 0);
    ctx.closePath();
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,.85)';
    ctx.beginPath();
    ctx.arc(c.x - 3, c.y - 4, 2.4, 0, 6.2832);
    ctx.fill();
  }
}

function drawPlayer(){
  const p = player;
  const h = playerHeight();
  const w = playerWidth();
  const x = p.x - w / 2;
  const y = p.y - h;

  // 地面阴影
  if (p.onGround || G.state === 'menu'){
    ctx.save();
    ctx.globalAlpha = 0.35;
    ctx.fillStyle = '#22d3ee';
    ctx.beginPath();
    ctx.ellipse(p.x, GY + 4, w * 0.55, 6, 0, 0, 6.2832);
    ctx.fill();
    ctx.restore();
  }

  // 身体
  ctx.save();
  ctx.shadowColor = '#22d3ee';
  ctx.shadowBlur = 26;
  const g = ctx.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0,    '#ffffff');
  g.addColorStop(0.55, '#8ef0ff');
  g.addColorStop(1,    '#1fb6d4');
  ctx.fillStyle = g;
  rr(x, y, w, h, 13);
  ctx.fill();
  ctx.restore();

  ctx.strokeStyle = 'rgba(215,255,255,.9)';
  ctx.lineWidth = 2;
  rr(x, y, w, h, 13);
  ctx.stroke();

  // 眼睛
  const eyeY = y + h * 0.36;
  const eyeR = Math.max(3, h * 0.105);
  ctx.fillStyle = '#0b2a3a';
  ctx.beginPath(); ctx.arc(x + w * 0.63, eyeY, eyeR, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w * 0.30, eyeY, eyeR, 0, 6.2832); ctx.fill();

  ctx.fillStyle = 'rgba(255,255,255,.92)';
  ctx.beginPath(); ctx.arc(x + w * 0.67, eyeY - eyeR * 0.4, eyeR * 0.4, 0, 6.2832); ctx.fill();
  ctx.beginPath(); ctx.arc(x + w * 0.34, eyeY - eyeR * 0.4, eyeR * 0.4, 0, 6.2832); ctx.fill();
}

function render(){
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  let sx = 0, sy = 0;
  if (G.shake > 0.5){
    sx = (Math.random() - 0.5) * G.shake;
    sy = (Math.random() - 0.5) * G.shake;
  }

  ctx.save();
  ctx.translate(sx, sy);

  drawSky();
  drawStars();
  drawSun();
  drawMountains();
  drawGround();

  if (G.state !== 'over') drawPlayer();
  drawObstacles();
  drawGems();
  drawParticles();

  ctx.restore();

  if (G.flash > 0.01){
    ctx.fillStyle = 'rgba(255,90,140,' + (G.flash * 0.55) + ')';
    ctx.fillRect(0, 0, W, H);
  }
}

/* =========================================================
   循环
   ========================================================= */
let lastTime = performance.now();
let acc = 0;
const STEP = 1000 / 60;

function loop(now){
  requestAnimationFrame(loop);
  let dt = now - lastTime;
  lastTime = now;
  if (dt > 220) dt = 220;
  acc += dt;

  let guard = 0;
  while (acc >= STEP && guard < 5){
    update();
    acc -= STEP;
    guard++;
  }
  if (guard >= 5) acc = 0;

  render();
  if (G.state === 'playing') updateHUD(false);
}

/* =========================================================
   HUD
   ========================================================= */
const elScore = document.getElementById('hud-score');
const elCoins = document.getElementById('hud-coins');
const elBest  = document.getElementById('hud-best');
let lastScore = -1, lastCoins = -1, lastBest = -1;

function updateHUD(force){
  if (force || G.score !== lastScore){ lastScore = G.score; elScore.textContent = G.score; }
  if (force || G.coins !== lastCoins){ lastCoins = G.coins; elCoins.textContent = G.coins; }
  if (force || bestScore !== lastBest){ lastBest = bestScore; elBest.textContent = bestScore; }
}

/* =========================================================
   界面切换
   ========================================================= */
const overlay = document.getElementById('overlay');

function showPanel(id){
  if (!id){
    overlay.classList.add('hidden');
    return;
  }
  overlay.classList.remove('hidden');
  const panels = document.querySelectorAll('.panel');
  for (let i = 0; i < panels.length; i++){
    panels[i].classList.toggle('hidden', panels[i].id !== id);
  }
}

/* =========================================================
   排行榜
   ========================================================= */
function getBoard(){
  try{
    const a = JSON.parse(store.get(LS_BOARD, '[]'));
    return Array.isArray(a) ? a : [];
  }catch(e){ return []; }
}
function saveBoard(b){
  store.set(LS_BOARD, JSON.stringify(b.slice(0, 10)));
}
function addScore(name, score, coins){
  const board = getBoard();
  board.push({ name: name, score: score, coins: coins, date: Date.now() });
  board.sort(function(a, b){ return b.score - a.score; });
  saveBoard(board);
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c];
  });
}
function renderBoard(){
  const list = getBoard();
  const el = document.getElementById('board-list');
  if (!list.length){
    el.innerHTML = '<div class="empty">还没有记录，快去跑一局吧 🚀</div>';
    return;
  }
  let html = '';
  for (let i = 0; i < list.length; i++){
    const e = list[i];
    html += '<div class="row' + (i === 0 ? ' top' : '') + '">' +
              '<span class="rank">' + (i + 1) + '</span>' +
              '<span class="name">' + escapeHtml(e.name || '匿名') + '</span>' +
              '<span class="coins">◆ ' + (e.coins || 0) + '</span>' +
              '<span class="score">' + (e.score || 0) + '</span>' +
            '</div>';
  }
  el.innerHTML = html;
}

let boardFrom = 'panel-menu';

function saveResult(){
  if (resultSaved || !pendingResult) return;
  const input = document.getElementById('name-input');
  const name = (input.value.trim() || '匿名跑者').slice(0, 10);
  store.set(LS_NAME, name);
  addScore(name, pendingResult.score, pendingResult.coins);
  resultSaved = true;
  const sb = document.getElementById('btn-save');
  sb.disabled = true;
  sb.textContent = '已保存 ✓';
  beep(660, 0.08, 'sine', 0.05);
  setTimeout(function(){ beep(990, 0.12, 'sine', 0.05); }, 80);
}

/* =========================================================
   事件绑定
   ========================================================= */
document.getElementById('btn-start').addEventListener('click', startGame);

document.getElementById('btn-board').addEventListener('click', function(){
  boardFrom = 'panel-menu';
  renderBoard();
  showPanel('panel-board');
});

document.getElementById('btn-board2').addEventListener('click', function(){
  boardFrom = 'panel-over';
  renderBoard();
  showPanel('panel-board');
});

document.getElementById('btn-board-back').addEventListener('click', function(){
  showPanel(boardFrom);
});

document.getElementById('btn-save').addEventListener('click', saveResult);

document.getElementById('btn-restart').addEventListener('click', function(){
  saveResult();
  startGame();
});

document.getElementById('name-input').addEventListener('keydown', function(e){
  if (e.key === 'Enter'){ e.preventDefault(); saveResult(); }
  e.stopPropagation();
});

// 键盘
window.addEventListener('keydown', function(e){
  if (e.code === 'Space' || e.code === 'ArrowUp' || e.code === 'KeyW'){
    e.preventDefault();
    if (G.state === 'playing') jump();
    else if (G.state === 'menu' && !overlay.classList.contains('hidden')) startGame();
    return;
  }
  if (e.code === 'ArrowDown' || e.code === 'KeyS'){
    e.preventDefault();
    if (G.state === 'playing') setDuck(true);
    return;
  }
});
window.addEventListener('keyup', function(e){
  if (e.code === 'ArrowDown' || e.code === 'KeyS') setDuck(false);
});

// 鼠标 / 触摸：点击画布跳跃
canvas.addEventListener('pointerdown', function(e){
  if (G.state === 'playing'){
    e.preventDefault();
    jump();
  }
});

// 触屏按钮
const tJump = document.getElementById('tjump');
const tDuck = document.getElementById('tduck');

tJump.addEventListener('pointerdown', function(e){ e.preventDefault(); jump(); });
tDuck.addEventListener('pointerdown', function(e){ e.preventDefault(); setDuck(true); });
['pointerup','pointerleave','pointercancel'].forEach(function(ev){
  tDuck.addEventListener(ev, function(){ setDuck(false); });
});

// 失焦时取消下蹲
window.addEventListener('blur', function(){ setDuck(false); });

/* =========================================================
   启动
   ========================================================= */
document.getElementById('menu-best').textContent = bestScore;
updateHUD(true);
showPanel('panel-menu');
requestAnimationFrame(loop);

})();
</script>
